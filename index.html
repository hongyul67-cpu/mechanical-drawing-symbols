<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 수업용 「모두 같은 문제」 — ?fix=1 로 열면 문제·보기 순서가 고정됩니다 -->
<script src="https://hongyul67-cpu.github.io/links/fixorder.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기계제도 기호 마스터</title>
<style>
  :root{
    --bg:#0f1319; --panel:#171c25; --panel2:#1f2531; --line:#2c3442;
    --text:#e8ecf3; --sub:#8a94a6; --accent:#f59e0b; --accent2:#38bdf8;
    --good:#34d399; --bad:#f87171; --warn:#fbbf24;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Pretendard","Segoe UI",-apple-system,sans-serif;
    min-height:100vh; padding:20px 14px 60px; line-height:1.6;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  header{margin-bottom:18px;}
  h1{font-size:23px;margin:0 0 4px;font-weight:800;letter-spacing:-.2px;}
  h1 span{color:var(--accent);}
  .sub{color:var(--sub);font-size:13px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
  .hidden{display:none !important;}

  /* ---- 홈 ---- */
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
  .card{
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px;
    cursor:pointer;transition:.15s;text-align:left;color:var(--text);font-family:inherit;
  }
  .card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .card .ico{font-size:30px;}
  .card h3{margin:8px 0 4px;font-size:16px;}
  .card p{margin:0;color:var(--sub);font-size:12.5px;}
  .bar{height:6px;background:#0c0f14;border-radius:99px;margin-top:12px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--good);width:0;transition:width .4s;}
  .bar-t{font-size:11px;color:var(--sub);margin-top:5px;}

  /* ---- 공통 UI ---- */
  .topnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .btn{border:none;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
  .btn-p{background:var(--accent);color:#231604;}
  .btn-p:hover{filter:brightness(1.1);}
  .btn-g{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  .btn-g:hover{border-color:var(--sub);}
  .btn-s{background:var(--accent2);color:#04222e;}
  .btn:disabled{opacity:.45;cursor:default;}
  .spacer{flex:1;}
  .tag{font-size:11.5px;color:var(--sub);background:var(--panel2);border:1px solid var(--line);
       padding:4px 10px;border-radius:99px;}

  .seg{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:10px;flex-wrap:wrap;}
  .seg button{border:none;background:transparent;color:var(--sub);padding:7px 13px;border-radius:7px;
    font-size:12.5px;cursor:pointer;font-weight:700;font-family:inherit;}
  .seg button.on{background:var(--accent);color:#231604;}

  /* ---- 배우기 카드 ---- */
  .learn{display:grid;gap:12px;}
  .lcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .lcard h4{margin:0 0 8px;font-size:15px;color:var(--accent);}
  .lcard p{margin:0 0 8px;font-size:13.5px;}
  .lcard ul{margin:6px 0 0;padding-left:18px;font-size:13px;}
  .lcard li{margin-bottom:4px;}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin-top:8px;}
  .kv b{color:var(--accent2);white-space:nowrap;}
  .formula{background:#0c0f14;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    font-family:"Consolas",monospace;font-size:13px;margin:8px 0;color:#cfe3ff;overflow-x:auto;}
  .note{font-size:12px;color:var(--sub);border-left:3px solid var(--accent);padding-left:10px;margin-top:8px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
  th{background:var(--panel2);color:var(--accent2);}
  .tscroll{overflow-x:auto;}

  /* ---- 기호 ---- */
  .symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px;}
  .sym{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center;}
  .sym svg{display:block;margin:0 auto 6px;}
  .sym .nm{font-size:12.5px;font-weight:700;}
  .sym .dt{font-size:11px;color:var(--sub);margin-top:2px;}

  /* ---- 문제 ---- */
  .q{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px;}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .qnum{font-size:12px;color:var(--sub);font-weight:700;}
  .qtext{font-size:16px;font-weight:700;margin-bottom:14px;line-height:1.5;}
  .qfig{text-align:center;margin:12px 0;}
  .opts{display:grid;gap:9px;}
  .opt{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    cursor:pointer;font-size:14px;text-align:left;color:var(--text);font-family:inherit;
    display:flex;align-items:center;gap:10px;transition:.12s;
  }
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt .mk{width:24px;height:24px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
  .opt.ok{border-color:var(--good);background:rgba(52,211,153,.12);}
  .opt.no{border-color:var(--bad);background:rgba(248,113,113,.1);}
  .opt:disabled{cursor:default;}
  .fb{margin-top:14px;padding:13px 15px;border-radius:10px;font-size:13.5px;display:none;line-height:1.6;}
  .fb.ok{display:block;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.35);color:var(--good);}
  .fb.no{display:block;background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.3);color:#fca5a5;}
  .fb b{color:var(--text);}

  .prog{height:7px;background:#0c0f14;border-radius:99px;overflow:hidden;margin:10px 0 4px;}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s;}

  /* ---- 결과 ---- */
  .result{text-align:center;padding:26px 18px;}
  .result .big{font-size:52px;}
  .result h2{margin:8px 0;font-size:22px;}
  .score-ring{font-size:40px;font-weight:800;color:var(--accent);}
  .wrongbox{text-align:left;margin-top:18px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:14px;font-size:13px;max-height:280px;overflow-y:auto;}
  .wrongbox h4{margin:0 0 8px;font-size:13px;color:var(--bad);}
  /* 오답노트는 그림·해설까지 들어가 길어진다 — 280px 상자 안에 가두지 않는다 */
  .wrongbox.review{max-height:none;overflow:visible;}
  .wrongbox .rvcard{border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px;margin:10px 0;text-align:left;}
  .wrongbox .rvcard div{border-bottom:none;padding:0;}
  .wrongbox .rvno{font-size:.8rem;opacity:.7;margin-bottom:6px;}
  .wrongbox .rvrow{font-size:.92rem;margin:4px 0;}
  .wrongbox .rvrow.ans{font-weight:700;color:var(--good);}
  .wrongbox .rvex{font-size:.88rem;line-height:1.6;opacity:.9;margin-top:8px;}
  .wrongbox .qfig{margin:8px 0;}
  .wrongbox div{padding:7px 0;border-bottom:1px solid var(--line);}
  .wrongbox div:last-child{border-bottom:none;}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--panel2);
    border:1px solid var(--line);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;
    z-index:999;display:none;box-shadow:0 6px 24px rgba(0,0,0,.4);}
  .toast.ok{border-color:var(--good);color:var(--good);}
  .toast.no{border-color:var(--bad);color:#fca5a5;}

  @media (max-width:600px){
    .qtext{font-size:15px;} h1{font-size:20px;}
    .opt{font-size:13.5px;padding:11px 12px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>기계제도 <span>기호</span> 마스터</h1>
    <div class="sub">표면 거칠기 · 치수공차와 끼워맞춤 · 기하 공차 — 배우고 나서 문제로 확인하세요</div>
  </header>

  <!-- ================= 홈 ================= -->
  <div id="home">
    <div class="panel">
      <div class="home-grid" id="homeGrid"></div>
    </div>
    <div class="panel">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div>
          <div style="font-size:15px;font-weight:800;">🏁 종합 점검 (20문항)</div>
          <div class="sub" style="font-size:12.5px;">세 영역을 섞어서 출제합니다. 결과를 선생님께 제출할 수 있어요.</div>
        </div>
        <div class="spacer"></div>
        <button class="btn btn-p" onclick="startExam()">종합 점검 시작</button>
      </div>
      <div class="bar" style="margin-top:12px;"><i id="examBar"></i></div>
      <div class="bar-t" id="examTxt">아직 응시하지 않았습니다</div>
    </div>
  </div>

  <!-- ================= 배우기 ================= -->
  <div id="learnView" class="hidden">
    <div class="topnav">
      <button class="btn btn-g" onclick="goHome()">← 홈</button>
      <div class="tag" id="learnTitle"></div>
      <div class="spacer"></div>
      <button class="btn btn-p" id="toQuizBtn">이 영역 문제 풀기 →</button>
    </div>
    <div class="panel"><div class="learn" id="learnBody"></div></div>
    <div style="text-align:center;margin-bottom:20px;">
      <button class="btn btn-p" onclick="fromLearnToQuiz()">배웠으니 문제 풀어보기 →</button>
    </div>
  </div>

  <!-- ================= 문제 ================= -->
  <div id="quizView" class="hidden">
    <div class="topnav">
      <button class="btn btn-g" onclick="goHome()">← 홈</button>
      <div class="tag" id="quizTitle"></div>
      <div class="spacer"></div>
      <div class="tag" id="quizScore">0점</div>
    </div>
    <div class="prog"><i id="quizProg"></i></div>
    <div class="qnum" id="quizCount" style="margin-bottom:10px;"></div>
    <div class="q" id="quizBody"></div>
    <div style="text-align:right;margin-top:14px;">
      <button class="btn btn-p hidden" id="nextBtn">다음 →</button>
    </div>
  </div>

  <!-- ================= 결과 ================= -->
  <div id="resultView" class="hidden">
    <div class="panel result">
      <div class="big" id="rEmoji">🎉</div>
      <h2 id="rTitle"></h2>
      <div class="score-ring" id="rScore"></div>
      <div class="sub" id="rSub" style="margin-top:6px;"></div>
      <div id="rWrong"></div>
      <div style="margin-top:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-g" onclick="goHome()">홈으로</button>
        <button class="btn btn-s" id="retryBtn">다시 풀기</button>
        <button class="btn btn-p hidden" id="rcSubmitBtn" onclick="rcSubmit()">🧑‍🏫 선생님께 제출</button>
      </div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
/* ==================================================================
   기계제도 기호 마스터
   출처: 기계제도(2015 개정, 서울교과서) Ⅰ단원 6·7·8절 / KS B 0401,
        KS B ISO 4287, KS A ISO 1101
   ================================================================== */

/* ---------- 기하공차 기호 SVG ---------- */
function gsvg(id, size){
  const s = size||46, h = s/2;
  const S = (inner)=>`<svg width="${s}" height="${s}" viewBox="0 0 46 46">
    <g fill="none" stroke="#e8ecf3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${inner}</g></svg>`;
  switch(id){
    case 'straight':  return S(`<line x1="7" y1="23" x2="39" y2="23"/>`);
    case 'flat':      return S(`<path d="M14 32 L36 32 L32 14 L10 14 Z"/>`);
    case 'round':     return S(`<circle cx="23" cy="23" r="13"/>`);
    case 'cylinder':  return S(`<circle cx="23" cy="23" r="10"/><line x1="9" y1="36" x2="16" y2="10"/><line x1="30" y1="36" x2="37" y2="10"/>`);
    case 'lineprof':  return S(`<path d="M8 29 Q23 8 38 29"/>`);
    case 'surfprof':  return S(`<path d="M8 30 Q23 9 38 30"/><line x1="6" y1="36" x2="40" y2="36"/>`);
    case 'parallel':  return S(`<line x1="15" y1="34" x2="23" y2="12"/><line x1="26" y1="34" x2="34" y2="12"/>`);
    case 'perp':      return S(`<line x1="23" y1="10" x2="23" y2="34"/><line x1="10" y1="34" x2="36" y2="34"/>`);
    case 'angle':     return S(`<line x1="9" y1="34" x2="37" y2="34"/><line x1="9" y1="34" x2="33" y2="13"/>`);
    case 'position':  return S(`<circle cx="23" cy="23" r="11"/><line x1="23" y1="6" x2="23" y2="40"/><line x1="6" y1="23" x2="40" y2="23"/>`);
    case 'concentric':return S(`<circle cx="23" cy="23" r="13"/><circle cx="23" cy="23" r="6"/>`);
    case 'symmetry':  return S(`<line x1="10" y1="15" x2="36" y2="15"/><line x1="10" y1="23" x2="36" y2="23"/><line x1="10" y1="31" x2="36" y2="31"/>`);
    case 'runout':    return S(`<line x1="10" y1="34" x2="34" y2="12"/><path d="M25 12 L34 12 L34 21"/>`);
    case 'totalrun':  return S(`<line x1="6" y1="34" x2="30" y2="12"/><path d="M21 12 L30 12 L30 21"/>
                                <line x1="16" y1="34" x2="40" y2="12"/><path d="M31 12 L40 12 L40 21"/>`);
    case 'datum':     return S(`<line x1="23" y1="8" x2="23" y2="26"/><path d="M23 26 L16 38 L30 38 Z" fill="#e8ecf3"/><line x1="12" y1="38" x2="34" y2="38"/>`);
  }
  return '';
}

/* 표면의 결 지시 기호 — 기본 √ 에 표시를 더해 제거 가공 여부를 나타냄 */
function surfSym(kind){
  // 짧은 다리(8,28)→(18,42), 긴 다리(18,42)→(36,8), 그 끝에서 수평 팔
  const legs = `<path d="M8 28 L18 42 L36 8 L66 8"/>`;
  let extra = '';
  if(kind==='must') extra = `<line x1="8" y1="28" x2="25.4" y2="28"/>`;   // 두 다리를 이어 삼각형을 닫음
  if(kind==='no')   extra = `<circle cx="21" cy="22" r="6.5"/>`;           // V 안에 원
  return `<svg width="72" height="50" viewBox="0 0 72 50">
    <g fill="none" stroke="#e8ecf3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      ${legs}${extra}
    </g></svg>`;
}

/* 다듬질(삼각) 기호 */
function triSym(n){
  let out='';
  for(let i=0;i<n;i++){
    const x=8+i*15;
    out+=`<path d="M${x} 32 L${x+11} 32 L${x+5.5} 16 Z" fill="none" stroke="#e8ecf3" stroke-width="2"/>`;
  }
  if(n===0) out=`<path d="M8 26 q6 -8 12 0 q6 8 12 0" fill="none" stroke="#e8ecf3" stroke-width="2"/>`;
  return `<svg width="${Math.max(70,n*15+20)}" height="42" viewBox="0 0 ${Math.max(70,n*15+20)} 42">${out}</svg>`;
}

/* ---------- 데이터: 기하 공차 14종 ---------- */
const GEO = [
  {id:'straight',  nm:'진직도',      cat:'모양', datum:false, desc:'직선이 얼마나 곧은지'},
  {id:'flat',      nm:'평면도',      cat:'모양', datum:false, desc:'평면이 얼마나 평평한지'},
  {id:'round',     nm:'진원도',      cat:'모양', datum:false, desc:'원이 얼마나 정확한 원인지'},
  {id:'cylinder',  nm:'원통도',      cat:'모양', datum:false, desc:'원통이 얼마나 정확한 원통인지'},
  {id:'lineprof',  nm:'선의 윤곽도', cat:'모양', datum:false, desc:'선의 윤곽이 이상 형상에 가까운 정도'},
  {id:'surfprof',  nm:'면의 윤곽도', cat:'모양', datum:false, desc:'면의 윤곽이 이상 형상에 가까운 정도'},
  {id:'parallel',  nm:'평행도',      cat:'자세', datum:true,  desc:'데이텀에 대해 얼마나 평행한지'},
  {id:'perp',      nm:'직각도',      cat:'자세', datum:true,  desc:'데이텀에 대해 얼마나 직각인지'},
  {id:'angle',     nm:'경사도',      cat:'자세', datum:true,  desc:'데이텀에 대해 지정 각도를 얼마나 지키는지'},
  {id:'position',  nm:'위치도',      cat:'위치', datum:true,  desc:'정해진 위치에서 얼마나 벗어났는지'},
  {id:'concentric',nm:'동심도(동축도)',cat:'위치',datum:true, desc:'중심(축)이 얼마나 일치하는지'},
  {id:'symmetry',  nm:'대칭도',      cat:'위치', datum:true,  desc:'데이텀 중심에 대해 얼마나 대칭인지'},
  {id:'runout',    nm:'원주 흔들림', cat:'흔들림',datum:true, desc:'1회전 시 특정 위치에서의 흔들림'},
  {id:'totalrun',  nm:'온 흔들림',   cat:'흔들림',datum:true, desc:'전체 면에 걸친 흔들림'}
];

/* ---------- 데이터: IT 기본 공차 (KS B 0401, 단위 µm) ---------- */
const IT_TABLE = {
  //  기준치수 구분      IT5 IT6 IT7 IT8 IT9 IT10 IT11
  '3 이하':      {5:4, 6:6,  7:10, 8:14, 9:25, 10:40, 11:60},
  '3~6':         {5:5, 6:8,  7:12, 8:18, 9:30, 10:48, 11:75},
  '6~10':        {5:6, 6:9,  7:15, 8:22, 9:36, 10:58, 11:90},
  '10~18':       {5:8, 6:11, 7:18, 8:27, 9:43, 10:70, 11:110},
  '18~30':       {5:9, 6:13, 7:21, 8:33, 9:52, 10:84, 11:130},
  '30~50':       {5:11,6:16, 7:25, 8:39, 9:62, 10:100,11:160},
  '50~80':       {5:13,6:19, 7:30, 8:46, 9:74, 10:120,11:190},
  '80~120':      {5:15,6:22, 7:35, 8:54, 9:87, 10:140,11:220}
};

/* ---------- 다듬질 기호 대응 (KS) ---------- */
const FINISH = [
  {tri:0, code:'~',  nm:'가공하지 않음',  ra:'—',        n:'—',      use:'주조·단조 표면 그대로'},
  {tri:1, code:'w',  nm:'거친 다듬질',    ra:'25a',      n:'N11',    use:'끼워맞춤이 없는 가공면, 축·핀의 끝면'},
  {tri:2, code:'x',  nm:'중 다듬질',      ra:'6.3a·12.5a',n:'N9·N10',use:'키 홈 면, 볼트 고정 접촉면, 기어 이끝면'},
  {tri:3, code:'y',  nm:'상 다듬질',      ra:'0.8a~3.2a',n:'N6~N8',  use:'기어 맞물림 면, 미끄럼 베어링 안지름'},
  {tri:4, code:'z',  nm:'정밀 다듬질',    ra:'0.05a~0.4a',n:'N2~N5', use:'볼·롤러 외면, 정밀 미끄럼 접촉면'}
];

/* ================= 배우기 콘텐츠 ================= */

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pickWrong(pool, right, n){ return shuffle(pool.filter(x=>x!==right)).slice(0,n); }

/* 정답 텍스트를 유지하며 보기 섞기 */
/* 보기 순서를 섞어 '정답은 늘 A' 가 되는 유출을 막는다 (정답 유출 3원칙)
   - 정답은 위치가 아니라 글자로만 판정하므로(answer() 가 텍스트 비교) 섞어도 채점은 그대로다
   - 수업 모드(fixorder.js)에서는 Math.random 이 고정 시드라 모든 학생이 같은 보기 순서를 본다 */
function normalizeQs(list){
  return list.map(q=>{
    const ansText = q.ansText!=null ? q.ansText : q.opts[q.a];
    return Object.assign({}, q, {ansText:ansText, opts:shuffle(q.opts)});
  });
}
function shuffleKeep(arr, ans){
  const uniq=[...new Set(arr)];
  if(!uniq.includes(ans)) uniq.push(ans);
  return shuffle(uniq);
}

function startExam(){
  S.mode='exam'; S.area=null;
  const per=[shuffle(bankSurf()).slice(0,7), shuffle(bankTol()).slice(0,7), shuffle(bankGeo()).slice(0,6)];
  S.qs=normalizeQs(shuffle([].concat(...per)));
  S.idx=0; S.score=0; S.wrong=[]; S.rev=[]; S.startAt=Date.now();
  document.getElementById('quizTitle').textContent='🏁 종합 점검 (20문항 · 시험)';
  show('quizView'); renderQ();
}

function renderQ(){
  const q=S.qs[S.idx];
  S.answered=false;
  document.getElementById('quizCount').textContent=`문제 ${S.idx+1} / ${S.qs.length}`;
  document.getElementById('quizProg').style.width=(S.idx/S.qs.length*100)+'%';
  // 시험은 진행 중 점수를 감춘다 (규약 §2)
  document.getElementById('quizScore').textContent=isExam()?'채점은 마지막에':S.score+'점';
  document.getElementById('nextBtn').classList.add('hidden');

  const ansText = q.ansText!=null ? q.ansText : q.opts[q.a];
  const body=document.getElementById('quizBody');
  body.innerHTML=`<div class="qtext">${q.q}</div>
    ${q.fig?`<div class="qfig">${q.fig}</div>`:''}
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>`;
  const wrap=document.getElementById('opts');
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span class="mk">${String.fromCharCode(65+i)}</span><span>${o}</span>`;
    b.onclick=()=>answer(i, o===ansText, ansText, q);
    wrap.appendChild(b);
  });
}

function isExam(){ return S.mode==='exam'; }
function answer(i, correct, ansText, q){
  if(S.answered) return;
  S.answered=true;
  const opts=[...document.querySelectorAll('#opts .opt')];
  const picked = opts[i] ? opts[i].querySelector('span:last-child').textContent : '';
  opts.forEach(b=>b.disabled=true);
  if(correct) S.score++;
  // 무엇을 골라서 틀렸는지까지 남긴다 (규약 §1 ②)
  if(!correct) S.wrong.push({q:q.q.replace(/<[^>]+>/g,''), pick:picked, ans:ansText});
  const fb=document.getElementById('fb');
  if(isExam()){
    // 시험 — 정답 표시·해설·알림을 전부 감추고 오답노트용으로만 담아 둔다 (규약 §2)
    (S.rev=S.rev||[]).push({no:S.idx+1, q:q.q, fig:q.fig, ex:q.ex, ok:correct, pick:picked, ans:ansText});
    fb.className='fb';
    fb.innerHTML='제출했어요 · 채점은 마지막에 한꺼번에 합니다';
    document.getElementById('quizScore').textContent='채점은 마지막에';
  }else{
    opts.forEach((b,bi)=>{
      const txt=b.querySelector('span:last-child').textContent;
      if(txt===ansText) b.classList.add('ok');
      else if(bi===i) b.classList.add('no');
    });
    if(correct){
      fb.className='fb ok';
      fb.innerHTML='✅ <b>정답!</b><br>'+q.ex;
      toast('정답!','ok');
    }else{
      fb.className='fb no';
      fb.innerHTML=`❌ <b>정답은 «${ansText}»</b><br>`+q.ex;
      toast('아쉬워요','no');
    }
    document.getElementById('quizScore').textContent=S.score+'점';
  }
  document.getElementById('nextBtn').classList.remove('hidden');
}
/* 오답노트 — 시험이 끝난 뒤에야 틀린 문제를 그림·해설과 함께 펼쳐 보여준다 (규약 §2) */
function examReview(){
  const wrongs=(S.rev||[]).filter(r=>!r.ok);
  if(!wrongs.length) return '<div class="wrongbox" style="color:var(--good)">틀린 문제가 없습니다! 완벽해요 🎯</div>';
  return '<div class="wrongbox review"><h4>📝 오답노트 — 틀린 '+wrongs.length+'문제</h4>'+
    wrongs.map(r=>
      '<div class="rvcard">'+
      '<div class="rvno">문제 '+r.no+'</div>'+
      '<div class="qtext">'+r.q+'</div>'+
      (r.fig?'<div class="qfig">'+r.fig+'</div>':'')+
      '<div class="rvrow">내 답 — '+(r.pick||'무응답')+'</div>'+
      '<div class="rvrow ans">정답 — '+r.ans+'</div>'+
      (r.ex?'<div class="rvex">'+r.ex+'</div>':'')+
      '</div>').join('')+'</div>';
}
document.getElementById('nextBtn').onclick=()=>{
  S.idx++;
  if(S.idx>=S.qs.length) finish(); else renderQ();
};

/* ================= 결과 ================= */
function finish(){
  const total=S.qs.length, pct=Math.round(S.score/total*100);
  if(window.RankKit) RankKit.award(pct);   /* 랭킹전 RP 정산 */
  const pass=pct>=70;
  document.getElementById('rEmoji').textContent = pct>=90?'🏆': pass?'🎉':'💪';
  document.getElementById('rTitle').textContent = pct>=90?'훌륭해요! 완벽에 가까워요'
    : pass?'합격! 잘 이해했어요':'조금만 더 연습해요';
  document.getElementById('rScore').textContent=`${S.score} / ${total} (${pct}%)`;
  const sec=Math.round((Date.now()-S.startAt)/1000);
  document.getElementById('rSub').textContent =
    `${S.mode==='exam'?'종합 점검':AREA[S.area].name} · 소요 시간 ${Math.floor(sec/60)}분 ${sec%60}초`;

  document.getElementById('rWrong').innerHTML = isExam() ? examReview()
    : (S.wrong.length
      ? `<div class="wrongbox"><h4>틀린 문제 ${S.wrong.length}개 — 다시 확인하세요</h4>
         ${S.wrong.map(w=>`<div>• ${w.q}<br><span style="color:var(--good)">→ 정답: ${w.ans}</span></div>`).join('')}</div>`
      : `<div class="wrongbox" style="color:var(--good)">틀린 문제가 없습니다! 완벽해요 🎯</div>`);

  // 최고 기록 저장
  const rec={correct:S.score,total:total,pct:pct};
  if(S.mode==='exam'){ if(!S.examBest||pct>S.examBest.pct) S.examBest=rec; }
  else { if(!S.best[S.area]||pct>S.best[S.area].pct) S.best[S.area]=rec; }
  save();

  /* 제출 버튼은 ?rc= 링크가 아니어도 항상 보인다 (CONVENTIONS.md §1 ③)
     — 숨기면 학생은 버튼이 있는 줄도 모른다. 링크가 아닐 때는 눌렀을 때 rcSubmit() 이 안내한다. */
  document.getElementById('rcSubmitBtn').classList.remove('hidden');
  document.getElementById('retryBtn').onclick=()=> S.mode==='exam'?startExam():startQuiz(S.area);
  show('resultView');
}

/* ================= 토스트 ================= */
let tTimer=null;
function toast(msg,kind){
  const t=document.getElementById('toast');
  clearTimeout(tTimer);
  t.className='toast '+(kind||'');
  t.textContent=msg; t.style.display='block';
  tTimer=setTimeout(()=>{t.style.display='none';},1100);
}

/* ================= 결과 제출 ================= */
function rcHasEndpoint(){
  return !!(window.ResultCollector && ResultCollector.config && ResultCollector.config.endpoint);
}
function rcSubmit(){
  if(!rcHasEndpoint()){
    alert(['이 링크로는 제출이 되지 않아요.','',
           '선생님이 나눠 준 제출용 링크(주소 뒤에 ?rc=... 가 붙은 링크)로',
           '들어와야 반·번호를 입력하고 결과를 보낼 수 있습니다.','',
           '연습은 지금 이대로 계속 하셔도 됩니다.'].join(String.fromCharCode(10)));
    return;
  }
  const total=S.qs.length, sec=Math.round((Date.now()-S.startAt)/1000);
  const modeName = '기계제도 기호 — ' + (S.mode==='exam' ? '종합 점검' : AREA[S.area].name);
  ResultCollector.open({
    score:Math.round(S.score/total*100),
    correct:S.score, total:total,
    wrong:S.wrong.map(w=>`${w.q} ${w.pick||'무응답'}→${w.ans}`),
    durationSec:sec,
    mode:modeName,
    retry: ResultCollector.bumpTry ? ResultCollector.bumpTry(modeName) : undefined,
    extra: S.mode==='exam' ? ["기계제도 기호 종합 이해"] : ['기계제도 기호 개념 이해']
  });
}

/* ================= 시작 ================= */
renderHome();
show('home');
</script>

<script>
/* ── 랭킹전(공용 계급) + 생기부 키워드 ──
   · 랭킹: 같은 data-tool("제도 마스터")을 쓰는 도구끼리 RP(랭크 포인트)가 하나로 쌓인다.
   · 생기부: 제출할 때 활동명·도전횟수·계급이 자동으로 얹혀 키워드·문장 초안이 만들어진다. */
(function(){
  var MODE_NAME = '기계제도 기호 마스터';
  var TRY_KEY   = 'try_제도';

  function bumpTry(m){
    var d={}; try{ d=JSON.parse(localStorage.getItem(TRY_KEY))||{}; }catch(e){}
    d[m]=(d[m]||0)+1;
    try{ localStorage.setItem(TRY_KEY, JSON.stringify(d)); }catch(e){}
    return d[m];
  }

  /* 오른쪽 아래 구석에는 공용 단추가 더 붙는다 —
     class-mode.js 의 「🎓 수업모드」(.cm-launch) 와 fx.js 의 소리 토글(#fxSnd).
     계급 배지는 z-index 가 낮아 그 밑에 깔려 안 보이므로, 붙어 있는 것들을 재서
     제일 위로 올린다. backbar.js 가 왼쪽 아래에서 쓰는 방식과 같다.
     두 단추가 fx.js 처럼 늦게 붙는 경우가 있어 load 뒤에 한 번 더 잰다. */
  function stackBadge(el){
    function place(){
      var up=10;
      ['.cm-launch','#fxSnd'].forEach(function(s){
        var o=document.querySelector(s); if(!o) return;
        var r=o.getBoundingClientRect();
        if(r.height) up=Math.max(up, Math.round(window.innerHeight-r.top)+6);
      });
      el.style.bottom=up+'px';
    }
    place();
    setTimeout(place,0);
    window.addEventListener('load',place);
    window.addEventListener('resize',place);   /* 폰 회전·창 크기 바뀜 */
  }

  /* 도구마다 화면 구조가 달라, 계급은 화면 구석 배지로 공통 표시한다 */
  function paintBadge(){
    if(!window.Rank || !document.body) return;
    var el=document.getElementById('rk-badge');
    if(!el){
      el=document.createElement('div'); el.id='rk-badge';
      el.style.cssText='position:fixed;right:10px;bottom:10px;z-index:9998;'
        +'font-size:11.5px;opacity:.9;pointer-events:none';
      document.body.appendChild(el);
      stackBadge(el);
    }
    try{ el.innerHTML=Rank.badge(); }catch(e){}
  }
  window.RankKit = {
    mode: MODE_NAME,
    /* 채점이 끝난 지점에서 호출 — RP 정산 + 승급 연출 */
    award: function(pct, mode){
      if(!window.Rank) return null;
      var rk=null;
      try{ rk=Rank.award(pct, {mode: mode||MODE_NAME}); }catch(e){}
      paintBadge();
      if(rk && rk.tierUp && window.FX){
        try{ FX.banner({icon:rk.tierAfter.icon, title:rk.tierAfter.name+' 승급!',
                        sub:rk.after+' RP · '+rk.tierAfter.full, stars:3}); }catch(e){}
      }
      return rk;
    }
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', paintBadge);
  else paintBadge();

  /* 생기부 — 제출 payload 에 활동명·도전횟수·계급을 자동으로 붙인다 */
  var t=setInterval(function(){
    if(!window.ResultCollector) return;
    clearInterval(t);
    if(ResultCollector.__kit) return;
    ResultCollector.__kit=1;
    var orig=ResultCollector.open;
    ResultCollector.open=function(p){
      p=p||{};
      var m=p.mode||MODE_NAME;
      p.mode=m;
      if(p.retry===undefined) p.retry=bumpTry(m);
      if(p.tier===undefined && window.Rank){ try{ p.tier=Rank.get().tier.full; }catch(e){} }
      return orig.call(this,p);
    };
  }, 60);
})();
</script>
